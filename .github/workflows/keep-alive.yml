# .github/workflows/keep-alive.yml
# =========================================================
# GARDER LE SERVEUR ÉVEILLÉ — Direct Transf'air
#
# Render (plan gratuit) endort le serveur après ~15 min sans requête ; le réveil prend 30 à 60 s (« Le serveur démarre… » dans l'app).
# Il vise à appeler GET /api/health toutes les 10 minutes pendant la journée (voir l’avertissement plus bas : en pratique GitHub ne le lance que quelques fois par jour).
#
# RÉGLAGES
#   • URL du serveur : variable de dépôt API_URL (Settings → Secrets and variables → Actions → Variables) ;
#     à défaut, l'adresse de production ci-dessous.
#   • Plage horaire : le cron est en UTC. « 5-22 » = de 05 h à 22 h 59 UTC, soit 06 h–23 h 59 en France (hiver) et 07 h–00 h 59 (été), 05 h–22 h 59 en Guinée.
#     Pour couvrir 24 h/24, remplacez par  '*/10 * * * *'.
#   • Lancement manuel : onglet Actions → « Keep API awake » → Run workflow.
#
# INTERRUPTEUR (sans modifier ce fichier)
#   • Variable de dépôt KEEP_ALIVE_ENABLED=false  → les exécutions planifiées sont ignorées (le job est « skipped », 0 minute facturée).
#     Supprimez la variable (ou mettez true) pour reprendre. Le lancement manuel (Run workflow) fonctionne toujours.
#
# ⚠️ CE WORKFLOW NE GARDE PAS RÉELLEMENT LE SERVEUR ÉVEILLÉ — À LIRE
#   • Constat mesuré sur ce dépôt (privé) : GitHub ne lance cette planification que 3 à 4 fois par jour, au lieu des ~108 prévues
#     (toutes les 10 min, 18 h/jour). GitHub retarde ou saute les exécutions planifiées des dépôts à faible activité ; le serveur
#     Render gratuit se rendort donc entre deux appels (réveil de 30 à 60 s au premier usage).
#   • Ne comptez pas sur lui pour la disponibilité. Solution fiable : un service de ping gratuit (cron-job.org ou UptimeRobot) sur
#     https://<votre-serveur>/api/health toutes les 10 min, puis KEEP_ALIVE_ENABLED=false ici. Un plan Render payant supprime le besoin.
#   • Coût : si GitHub exécutait vraiment tout, ce serait ≈ 3 240 minutes/mois pour 2 000 offertes (dépôt privé). C'est une raison de
#     plus de passer par un ping externe plutôt que de « réparer » ce workflow.
#
# AUTRES LIMITES
#   • Render gratuit : 750 h d'instance par mois pour TOUS les services gratuits du compte. Un service éveillé 24 h/24 ≈ 744 h : deux services ne tiennent pas.
# =========================================================
name: Keep API awake

on:
  schedule:
    - cron: '*/10 5-22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    # Les exécutions planifiées s'arrêtent si la variable KEEP_ALIVE_ENABLED vaut « false » ; le lancement manuel passe toujours.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.KEEP_ALIVE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Réveiller / contrôler le serveur
        env:
          API_URL: ${{ vars.API_URL || 'https://direct-transfair-backend.onrender.com' }}
        run: |
          url="${API_URL%/}/api/health"
          echo "Contrôle de $url"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 45 "$url" || true)
            code=${code:-000}
            echo "Tentative $i → HTTP $code"
            case "$code" in
              200) cat /tmp/body; echo; exit 0 ;;
              404) echo "Serveur éveillé (route /health pas encore déployée)."; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Le serveur ne répond pas correctement (dernier code HTTP $code)."
          exit 1
